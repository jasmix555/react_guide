<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LP コーダーのための React + TypeScript 実践ガイド。うちの標準に沿って、迷わず書けるようになる。"
    />
    <title>React実践ガイド</title>
    <!-- Set the theme BEFORE first paint to avoid a flash of the wrong theme.
         A saved manual choice wins; otherwise follow the OS. ThemeToggle keeps
         data-theme in sync afterwards. The token CSS reads :root[data-theme]. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
